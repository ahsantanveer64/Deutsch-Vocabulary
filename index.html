<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deutsch Vocabulary · Ahsan Tanveer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap">
<style>
:root{--page:#e2d8c3;--card:#fff;--text:#141a26;--sub:#4b5468;--muted:#8a92a3;--line:#e8e4da;--ink:#0d5c63;--ink-2:#14838c;--ink-soft:#e3f2f1;--mast-a:#d9efe9;--mast-b:#fbf9f4;--title:#12302f;
--sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--serif:"Newsreader",Georgia,serif}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;background:var(--page) radial-gradient(color-mix(in srgb,var(--ink) 12%,transparent) 1px,transparent 1.2px) 0 0/18px 18px;color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.flag{height:15px;background:linear-gradient(180deg,#000 0 5px,#dd0000 5px 10px,#ffce00 10px 15px)}
.mast{background:radial-gradient(1200px 300px at 85% -40%,var(--mast-a) 0,transparent 60%),linear-gradient(180deg,#fff,var(--mast-b));border-bottom:1px solid var(--line)}
.wrap{max-width:980px;margin:0 auto;padding:0 24px}
.mast .wrap{padding-top:28px;padding-bottom:30px}
.who{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);background:var(--ink-soft);padding:4px 10px;border-radius:999px}
.author{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--title)}
.avatar{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--ink),var(--ink-2));color:#fff;font-size:11px;font-weight:700}
h1{font-family:var(--serif);font-weight:600;font-size:40px;line-height:1.08;margin:14px 0 6px;letter-spacing:-.015em;color:var(--title)}
.deflag{display:inline-block;width:46px;height:28px;border-radius:5px;margin-right:14px;vertical-align:-2px;background:linear-gradient(180deg,#000 0 33.34%,#dd0000 33.34% 66.67%,#ffce00 66.67%);box-shadow:0 2px 6px rgba(0,0,0,.18)}
.lede{margin:0;color:var(--sub);font-size:15px}
main .wrap{padding-top:32px;padding-bottom:48px}
.grid{display:grid;grid-template-columns:minmax(0,380px);gap:18px}
.lvl{position:relative;display:block;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 22px 20px;text-decoration:none;color:inherit;box-shadow:0 1px 2px rgba(16,24,40,.05);transition:transform .15s,box-shadow .15s,border-color .15s}
a.lvl:hover{transform:translateY(-2px);border-color:var(--ink-2);box-shadow:0 10px 24px -12px rgba(13,92,99,.45)}
a.lvl:focus-visible{outline:3px solid var(--ink-2);outline-offset:2px}
.badge{display:inline-grid;place-items:center;width:56px;height:56px;border-radius:14px;font-family:var(--serif);font-size:26px;font-weight:600;color:#fff;background:linear-gradient(135deg,var(--ink),var(--ink-2))}
.lvl h2{font-family:var(--serif);font-size:22px;font-weight:600;margin:14px 0 4px;color:var(--title)}
.lvl p{margin:0;color:var(--sub);font-size:14px}
.go{display:inline-flex;align-items:center;gap:6px;margin-top:16px;font-weight:600;font-size:14px;color:var(--ink)}
.stats{display:flex;gap:14px;margin-top:12px;font-size:13px;color:var(--muted)}
.stats b{color:var(--title);font-weight:600}
footer{color:var(--sub);font-size:13px;padding-top:26px}
@media (max-width:760px){.grid{grid-template-columns:1fr}h1{font-size:30px}.deflag{width:36px;height:22px;margin-right:10px}.wrap{padding:0 16px}}
</style>
</head>
<body>
<div class="flag"></div>
<header class="mast"><div class="wrap">
  <div class="who"><span class="eyebrow">Deutsch Vocabulary</span><span class="author"><span class="avatar">AT</span>Ahsan Tanveer</span></div>
  <h1><span class="deflag" aria-hidden="true"></span>Deutscher Wortschatz</h1>
  <p class="lede">Vokabeln mit Verbformen, Kasus, Präpositionen, Synonymen, Beispielsätzen und Aussprache.</p>
</div></header>
<main><div class="wrap">
  <div class="grid">
    <a class="lvl" href="B1/">
      <span class="badge">B1</span>
      <h2>Niveau B1</h2>
      <p>Kapitel 1 bis 12</p>
      <div class="stats"><span><b>872</b> Wörter</span><span><b>244</b> Verben</span><span><b>480</b> Nomen</span></div>
      <span class="go">Öffnen &rarr;</span>
    </a>
  <footer>© Ahsan Tanveer</footer>
</div></main>
</body>
</html>
